<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="880" height="180" font-family="'DM Sans','Helvetica Neue',Arial,sans-serif" role="img" aria-label="Cloudbreak architecture. A validator snapshot and live gRPC updates feed the complete account state; live gRPC updates also feed the Cloudbreak indexes; both the account state and the indexes feed the JSON-RPC query layer, which your app queries; your app registers query patterns with the query tracker (dashed), which builds the Cloudbreak indexes (dashed).">
