    <rect x="235" y="25" width="155" height="56" rx="10"/>
    <rect x="455" y="25" width="155" height="56" rx="10"/>
    <rect x="15" y="110" width="155" height="56" rx="10"/>
    <rect x="235" y="110" width="155" height="56" rx="10"/>
    <rect x="455" y="110" width="155" height="56" rx="10"/>
  </g>
  <rect x="690" y="25" width="155" height="56" rx="10" fill="#D6EAF8" stroke="#259DD0" stroke-width="2"/>
  <g fill="#171717" font-size="13.5" text-anchor="middle">
    <text x="92.5" y="53" font-weight="600" dominant-baseline="central">Validator snapshot</text>
    <text x="312.5" y="46" font-weight="600" dominant-baseline="central">Complete</text>
    <text x="312.5" y="62" font-weight="600" dominant-baseline="central">account state</text>
    <text x="532.5" y="46" font-weight="600" dominant-baseline="central">JSON-RPC</text>
    <text x="532.5" y="62" font-weight="600" dominant-baseline="central">query layer</text>
