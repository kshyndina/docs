    <path d="M170,53 L231,53"/>
    <path d="M170,120 L231,72"/>
    <path d="M170,138 L231,138"/>
    <path d="M390,53 L451,53"/>
    <path d="M390,120 L451,72"/>
    <path d="M610,53 L686,53"/>
  </g>
  <g fill="none" stroke="#956FB3" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)">
    <path d="M730,81 L602,112"/>
    <path d="M453,138 L394,138"/>
  </g>
  <g stroke="#7A4BA0" stroke-width="2" fill="#F2EDF6">
